<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lycée Mohamed Bjaoui 1</title>
    <style>
        /* Couleurs et Police */
        body {
            background-color: #0d1b2a;
            color: #e0e1dd;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Conteneur principal */
        .container {
            background-color: #1b263b;
            max-width: 600px;
            width: 100%;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            border: 1px solid #415a77;
        }

        h1 {
            color: #778da9;
            font-size: 2.5rem;
            margin-bottom: 10px;
            border-bottom: 2px solid #415a77;
            padding-bottom: 10px;
        }

        .welcome-msg {
            font-size: 1.5rem;
            color: #ffffff;
            margin: 20px 0;
        }

        .info-section {
            background-color: #415a77;
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin-top: 25px;
            text-align: right;
        }

        .info-section h2 {
            font-size: 1.2rem;
            margin-top: 0;
            color: #1b263b;
        }

        footer {
            margin-top: 40px;
            font-size: 0.9rem;
            color: #778da9;
        }

        /* Petit effet au survol */
        .container:hover {
            transform: translateY(-5px);
            transition: 0.3s;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>ثانوية محمد بجاوي 1</h1>
        
        <p class="welcome-msg">مرحبا بكم في الموقع الرسمي</p>
        
        <div class="info-section">
            <h2>معلومات عن الثانوية</h2>
            <p>📍 الموقع: باب الزوار، الجزائر</p>
            <p>📚 التعليم: ثانوي (جميع الشعب)</p>
            <p>✨ نسعى دائما لتقديم الأفضل لطلابنا</p>
        </div>

        <footer>
            © 2026 Lycée Mohamed Bjaoui 1 - Tous droits réservés
        </footer>
    </div>

</body>
</html>
